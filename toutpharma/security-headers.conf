# En-têtes de sécurité ToutPharma.
# nginx : un add_header dans un bloc location annule ceux hérités du serveur —
# ce fichier est donc inclus dans le bloc server ET dans chaque location qui
# définit ses propres add_header (cache).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# CSP : scripts uniquement depuis notre origine ; styles inline requis par
# React (attributs style) + Google Fonts ; images externes autorisées
# (catalogue) ; API et uploads en même origine.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
