# ToutPharma — production : images pré-construites par la CI (GHCR).
# Sur le serveur :
#   cp .env.deploy.example .env   (et remplir les valeurs)
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
services:
  backend:
    image: ${IMAGE_PREFIX:?Définir IMAGE_PREFIX dans .env (ex. ghcr.io/mon-user/mon-repo)}-backend:${TAG:-latest}
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Définir ADMIN_PASSWORD dans .env}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:?Définir ADMIN_TOKEN_SECRET dans .env}
      PUBLIC_URL: ${PUBLIC_URL:?Définir PUBLIC_URL dans .env (ex. https://toutpharma.sn)}
      DB_PATH: /app/data/database.sqlite
      # 2FA admin (optionnelle) — générer avec : npm run totp-setup
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      # Notification WhatsApp de commande (optionnelle, API officielle Meta)
      WHATSAPP_CLOUD_TOKEN: ${WHATSAPP_CLOUD_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_NOTIFY_TO: ${WHATSAPP_NOTIFY_TO:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      WHATSAPP_GATEWAY_URL: ${WHATSAPP_GATEWAY_URL:-}
      WHATSAPP_GATEWAY_KEY: ${WHATSAPP_GATEWAY_KEY:-}
      WHATSAPP_GATEWAY_SESSION: ${WHATSAPP_GATEWAY_SESSION:-}
    volumes:
      - toutpharma-data:/app/data
      - toutpharma-uploads:/app/uploads
    restart: unless-stopped

  front:
    image: ${IMAGE_PREFIX}-front:${TAG:-latest}
    ports:
      - "${FRONT_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  toutpharma-data:
  toutpharma-uploads:
